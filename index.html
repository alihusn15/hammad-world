<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hammad World — Tiles, Sanitaryware &amp; Ceiling Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --green-900:#0B4A36;
    --green-700:#178A63;
    --coral:#FF5A36;
    --gold:#C9971F;
    --cream:#FBF7F0;
    --ink:#1C2620;
    --ink-500:#5F6D66;
    --line:#DCE6E0;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  h1,h2,h3,.brand{font-family:'Poppins',sans-serif;}

  /* ---------- Hero ---------- */
  header.hero{
    background:linear-gradient(135deg, var(--green-900) 0%, var(--green-700) 100%);
    color:var(--white);
    padding:40px 20px 32px;
    text-align:center;
  }
  header.hero .brand{font-size:28px;font-weight:800;letter-spacing:0.2px;}
  header.hero .tagline{font-size:14.5px;opacity:0.88;margin-top:6px;}
  header.hero .contact{
    display:inline-block;margin-top:18px;background:var(--coral);color:var(--white);
    padding:10px 22px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;
  }

  /* ---------- Filter bar ---------- */
  .filterbar{
    max-width:1100px;margin:0 auto;padding:18px 16px 6px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .filterbar input[type=search]{
    flex:1;min-width:180px;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;
    font-size:14px;background:var(--white);
  }
  .catpill{
    padding:8px 16px;border-radius:6px;border:1.5px solid var(--line);background:var(--white);
    font-size:13.5px;font-weight:600;color:var(--ink-500);cursor:pointer;white-space:nowrap;
  }
  .catpill.active{background:var(--green-900);color:var(--white);border-color:var(--green-900);}

  /* ---------- The tile grid — literal grout lines between products ---------- */
  .gridwrap{max-width:1100px;margin:20px auto 40px;padding:0 16px;}
  .tilegrid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:2px;
    background:var(--ink);
    border:2px solid var(--ink);
  }
  .tile{
    background:var(--white);
    display:flex;flex-direction:column;
    position:relative;
  }
  .tile .photo{
    width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--line);
  }
  .tile .noPhoto{
    width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    background:var(--line);color:var(--ink-500);font-size:12px;text-align:center;padding:8px;
  }
  .tile .status{
    position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:4px;
    color:var(--white);
  }
  .status.instock{background:var(--green-700);}
  .status.limited{background:var(--gold);}
  .status.outofstock{background:#A3372E;}
  .status.comingsoon{background:var(--ink-500);}
  .tile .info{padding:10px 12px 12px;}
  .tile .name{font-size:13.5px;font-weight:700;line-height:1.3;margin-bottom:2px;}
  .tile .meta{font-size:11.5px;color:var(--ink-500);line-height:1.5;}
  .tile .meta span{display:block;}
  .tile .price{font-size:11.5px;color:var(--coral);font-weight:700;margin-top:6px;}
  .tile .enquire{
    display:block;margin-top:8px;text-align:center;background:var(--green-900);color:var(--white);
    font-size:12px;font-weight:600;padding:7px;border-radius:6px;text-decoration:none;
  }

  .empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--ink-500);}
  footer{text-align:center;padding:24px 16px;color:var(--ink-500);font-size:12.5px;}

  @media (min-width:700px){
    .tilegrid{grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="brand">Hammad World</div>
  <div class="tagline">Tiles &middot; Sanitaryware &middot; Ceiling Materials</div>
  <a class="contact" id="topWhatsapp" href="#" target="_blank" rel="noopener">Chat on WhatsApp</a>
</header>

<div class="filterbar">
  <input type="search" id="searchBox" placeholder="Search products..." oninput="renderGrid()"/>
</div>
<div class="filterbar" id="categoryPills" style="padding-top:0;"></div>

<div class="gridwrap">
  <div class="tilegrid" id="grid">
    <div class="empty">Loading products...</div>
  </div>
</div>

<footer>Prices on request — contact us on WhatsApp for the latest rates.</footer>

<script>
/* ====================== SETTINGS — edit these two lines ====================== */
const SHOP_WHATSAPP_NUMBER = '916900281080'; // Your WhatsApp number
const SHOP_NAME = 'Hammad World';
/* ================================================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyDjqo-CjqSs4lSEnVTS9JuELAHCP2iFmVQ",
  authDomain: "hammad-world.firebaseapp.com",
  projectId: "hammad-world",
  storageBucket: "hammad-world.firebasestorage.app",
  messagingSenderId: "1022266009839",
  appId: "1:1022266009839:web:4129f10f8856d36d25531a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allProducts = [];
let activeCategory = '';

function waLink(productName){
  const msg = productName
    ? `Hi, I'm interested in "${productName}" — could you share the price and availability?`
    : `Hi, I'd like to know more about your products.`;
  return `https://wa.me/${SHOP_WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}
document.getElementById('topWhatsapp').href = waLink();

function statusClass(status){
  if(status==='In Stock') return 'instock';
  if(status==='Limited Stock') return 'limited';
  if(status==='Out of Stock') return 'outofstock';
  return 'comingsoon';
}

function renderCategoryPills(){
  const cats = Array.from(new Set(allProducts.map(p=>p.category).filter(Boolean))).sort();
  const el = document.getElementById('categoryPills');
  el.innerHTML = `<button class="catpill ${activeCategory===''?'active':''}" onclick="setCategory('')">All</button>` +
    cats.map(c=>`<button class="catpill ${activeCategory===c?'active':''}" onclick="setCategory('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');
}
function setCategory(c){ activeCategory = c; renderCategoryPills(); renderGrid(); }
window.setCategory = setCategory;

function renderGrid(){
  const grid = document.getElementById('grid');
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  let list = allProducts.filter(p=>{
    if(activeCategory && p.category !== activeCategory) return false;
    if(search){
      const hay = (p.itemName+' '+p.category+' '+p.subcategory+' '+p.material).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });
  if(!list.length){
    grid.innerHTML = `<div class="empty">No products found — try a different search or category.</div>`;
    return;
  }
  grid.innerHTML = list.map(p=>{
    const photo = (p.photos && p.photos[0]) ? p.photos[0] : null;
    const metaLine1 = p.subcategory || p.category || '';
    const metaLine2 = [p.material, p.size].filter(Boolean).join(', ');
    const statusLabel = p.status || 'In Stock';
    return `
      <div class="tile">
        ${photo
          ? `<img class="photo" src="${photo}" alt="${p.itemName}" loading="lazy"/>`
          : `<div class="noPhoto">Photo coming soon</div>`}
        <span class="status ${statusClass(statusLabel)}">${statusLabel}</span>
        <div class="info">
          <div class="name">${p.itemName||'Unnamed product'}</div>
          <div class="meta">${metaLine1 ? `<span>${metaLine1}</span>` : ''}${metaLine2 ? `<span>${metaLine2}</span>` : ''}</div>
          <div class="price">Contact for price</div>
          <a class="enquire" href="${waLink(p.itemName)}" target="_blank" rel="noopener">Enquire on WhatsApp</a>
        </div>
      </div>`;
  }).join('');
}

db.collection('catalog').get().then(snap=>{
  allProducts = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(p=>p.itemName);
  allProducts.sort((a,b)=> (a.itemName||'').localeCompare(b.itemName||''));
  renderCategoryPills();
  renderGrid();
}).catch(err=>{
  console.error(err);
  document.getElementById('grid').innerHTML =
    `<div class="empty">Could not load products.<br><br><b>Technical detail:</b> ${err.code||''} ${err.message||err}<br><br>If this says "permission-denied," the Firestore rules for the "catalog" collection likely need to be re-published.</div>`;
});
</script>
</body>
</html>
