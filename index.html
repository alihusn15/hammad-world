/* Creates a login for a new staff/owner account without disturbing the
   current session. Firebase's normal "create user" call signs in as that
   new user immediately — which would log the owner out mid-task. The fix:
   spin up a second, throwaway connection to the same Firebase project just
   for this one step, then close it. No Cloud Function or paid plan needed. */
async function createStaffAccount(){
  if(!requireOwner())return;
  const name = document.getElementById('quickUserName').value.trim();
  const email = document.getElementById('quickUserEmail').value.trim();
  const password = document.getElementById('quickUserPassword').value;
  const role = document.getElementById('quickUserRole').value;
  if(!name || !email || !password){ alert('Fill in name, email and password.'); return; }
  if(password.length<6){ alert('Password needs to be at least 6 characters.'); return; }

  const cfg = getStoredConfig();
  let secondaryApp;
  try{
    secondaryApp = firebase.initializeApp(cfg, 'AccountCreator_'+Date.now());
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
    const newUid = cred.user.uid;
    await secondaryApp.auth().signOut();
    await fsDB.collection('users').doc(newUid).set({name, role});
    logAudit('Staff account created', name+' ('+email+') → '+role);
    alert('Account created.\n\nEmail: '+email+'\nPassword: '+password+'\n\nShare these with '+name+' — they will use them on the sign-in screen.');
    document.getElementById('quickUserName').value='';
    document.getElementById('quickUserEmail').value='';
    document.getElementById('quickUserPassword').value='';
  }catch(e){
    console.error(e);
    alert('Could not create account: '+e.message);
  }finally{
    if(secondaryApp) secondaryApp.delete().catch(()=>{});
  }
}
window.createStaffAccount = createStaffAccount;

function saleShareText(sale){
  const shop=db.shopInfo||{}, lines=[shop.name||'Hammad World'];
  lines.push('Sale bill: '+(sale.billNo||sale.id), 'Date: '+(sale.date||''), 'Customer: '+(sale.customer||'Walk-in'));
  lines.push('');
  (sale.items||[]).forEach((it,idx)=>{
    const boxes=Number(it.boxQty||0), pieces=Number(it.pieceQty||0);
    const qty=(boxes?boxes+' box'+(boxes===1?'':'es'):'')+(boxes&&pieces?' + ':'')+(pieces?pieces+' piece'+(pieces===1?'':'s'):'');
    const gross=boxes*Number(it.boxPrice||0)+pieces*Number(it.piecePrice||0);
    const afterDiscount=gross*(1-Number(it.discount||0)/100);
    lines.push((idx+1)+'. '+(it.itemName||'Item')+' — '+(qty||'0 pieces')+' — '+fmt(afterDiscount));
  });
  lines.push('', 'Total: '+fmt(sale.totalAmount||0));
  if(shop.address)lines.push('Address: '+shop.address);
  if(shop.phone)lines.push('Phone: '+shop.phone);
  return lines.join('\n');
}

async function copySaleShareText(text){
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return;}
  const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();
  const copied=document.execCommand&&document.execCommand('copy');area.remove();if(!copied)throw Error('Sharing is not supported in this browser.');
}

/* ===================== KEYBOARD FIELD NAVIGATION (desktop convenience) =====================
   Press Enter (or Down arrow) in any field to jump to the next one, Up arrow to
   go back — like moving between cells in a spreadsheet. Works everywhere in the
   app automatically since it just looks at whatever's currently on screen. */
function focusAdjacentField(current, direction){
  const all = Array.from(document.querySelectorAll('input, select')).filter(function(f){
    return f.offsetParent !== null && !f.disabled;
  });
  const idx = all.indexOf(current);
  if(idx===-1) return;
  const nextIdx = idx + direction;
  if(nextIdx>=0 && nextIdx<all.length){
    all[nextIdx].focus();
    try{ all[nextIdx].select(); }catch(e){}
  }
}
document.addEventListener('keydown', function(e){
  const el = document.activeElement;
  if(!el) return;
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='SELECT') return;
  const isSelect = tag==='SELECT';
  if(e.key==='Enter' || (!isSelect && e.key==='ArrowDown')){
    e.preventDefault();
    focusAdjacentField(el, 1);
  } else if(!isSelect && e.key==='ArrowUp'){
    e.preventDefault();
    focusAdjacentField(el, -1);
  }
});

function hwEntryFeed(){const types=['sales','purchases','saleReturns','purchaseReturns','payments','quotations'];const ownerId=firebase.auth().currentUser?.uid;const rows=types.flatMap(c=>(db[c]||[]).filter(r=>r.createdBy&&r.createdBy!==ownerId).map(r=>({...r,kind:c}))).sort((a,b)=>String(b.enteredAt||b.date||'').localeCompare(String(a.enteredAt||a.date||''))).slice(0,30);return '<div class="card"><h3>Shop entries in your portal</h3><p>Staff entries update here while this portal is online.</p>'+rows.map(r=>'<div class="list-row"><div><b>'+escapeHtml(r.createdByName||r.createdBy)+'</b><div>'+escapeHtml(r.kind+' '+(r.billNo||r.quoteNo||r.id))+'</div><div>'+escapeHtml(r.enteredAt||r.date)+'</div></div></div>').join('')+'</div>';}

const hwOldDashboard=renderDashboard;
renderDashboard=function(){if(CLOUD_MODE&&!isOwner())return '<div class="card"><h3>Staff workspace</h3><p>Signed in as '+escapeHtml(hwCurrentActor||currentUserEmail)+'. Confirmed entries are saved to the owner portal.</p><div class="stat-grid">'+[['purchase','new','＋','Purchase'],['sales','new','₹','Sale'],['purchase','return','↩','Purchase return'],['sales','return','↩','Sale return']].map(([sc,mode,icon,label])=>'<button type="button" class="stat" style="cursor:pointer;font:inherit;text-align:left;width:100%" onclick="'+(sc==='purchase'?'purchaseScreenMode':'saleScreenMode')+'=\''+mode+'\';setScreen(\''+sc+'\')"><div class="num">'+icon+'</div><div class="lbl">'+label+'</div></button>').join('')+'</div>'+[['purchaseLookup','Check purchase bill'],['fullLedger','Ledger and bills'],['parties','Parties'],['staffPayment','Payment received'],['quotations','Quotations'],['stock','Stock and history'],['syncQueue','Pending sales']].map(([s,t])=>'<button class="btn btn-ghost" style="margin:5px" onclick="setScreen(\''+s+'\')">'+t+'</button>').join('')+'<button class="btn btn-ghost" onclick="hwRefreshStock()">Refresh stock</button><button class="btn btn-ghost" onclick="doLogout()">Sign out</button></div>';return hwOldDashboard()+(CLOUD_MODE?hwEntryFeed():'');};
const hwOldRender=render;
render=function(){const main=document.getElementById('main');if(!CLOUD_MODE)return hwOldRender();document.querySelectorAll('.nav-btn').forEach(b=>{b.hidden=!isOwner()&&b.dataset.screen==='reports';});updateCloudBadge();if(!isOwner()&&hwOwnerScreens.has(currentScreen)){main.innerHTML=ownerOnlyNotice();return;}if(currentScreen==='syncQueue'){main.innerHTML=hwRenderQueue();return;}if(currentScreen==='purchaseLookup'){main.innerHTML=hwRenderPurchaseSearch();return;}if(currentScreen==='staffPayment'&&!isOwner()){main.innerHTML=hwRenderStaffPayment();return;}
 if(hwNeedHistory()){main.innerHTML='<div class="card"><h3>Complete history needed</h3><p>This screen calculates balances or uses older records. Load complete history to avoid showing incomplete totals. Routine billing loads only the current month.</p><p>Loading complete history uses additional database reads for this session.</p><button class="btn btn-primary" onclick="hwLoadHistory()" '+(hwHistoryLoading?'disabled':'')+'>'+(hwHistoryLoading?'Loading…':'Load complete history')+'</button><p>'+escapeHtml(hwHistoryError)+'</p></div>';return;}
   hwOldRender();};window.render=render;
const hwOldSettings=renderShopSettings;
renderShopSettings=function(){return hwOldSettings()+'<div class="card"><h3>Economy mode and shop staff access</h3><p>Routine startup loads stock, parties and this month’s entries. Complete financial history is loaded only when requested. Shop staff see purchase bills and stock. Saves check current server stock.</p><p>Public catalogue rebuilds are spaced at least 15 minutes apart. This does not delay entries in the owner portal.</p><button class="btn btn-ghost" onclick="setScreen(\'syncQueue\')">Pending sales</button></div>';};window.renderShopSettings=renderShopSettings;
const hwOldCloudBadge=updateCloudBadge;
updateCloudBadge=function(){hwOldCloudBadge();const el=document.getElementById('cloudBadge');if(!el||!CLOUD_MODE)return;el.onclick=()=>setScreen('syncQueue');el.textContent=hwQueueBusy?'Syncing entries…':hwQueue.length?hwQueue.length+' pending sync':!navigator.onLine?'Offline — sales can queue':hwCloudError?'Sync needs attention':!hwCloudReady?'Connecting…':'Connected · entries synced';el.classList.toggle('offline',!!hwQueue.length||!navigator.onLine||!!hwCloudError);};
window.addEventListener('online',()=>{hwSyncQueue();});
window.addEventListener('offline',()=>{updateCloudBadge();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)hwSyncQueue();});
const hwOldPrint=renderPrintPreview;
renderPrintPreview=function(){let content=hwOldPrint();const map={sale:'sales',purchase:'purchases',saleReturn:'saleReturns',quotation:'quotations'};const rec=db[map[printDoc?.type]]?.find(r=>r.id===printDoc.id);if(rec?.createdByName)content='<div class="step">Entered by '+escapeHtml(rec.createdByName)+' · '+escapeHtml(rec.enteredAt||rec.date)+'</div>'+content;return content;};

window.render=render;window.saveSale=saveSale;window.savePurchase=savePurchase;window.saveSaleReturn=saveSaleReturn;window.saveQuotation=saveQuotation;
/* Incoming units revision. qty/freeQty and rate/cost/mrp retain their historical
   BOX meaning. pieceQty/freePieceQty are additional whole pieces. entryUnit is
   presentation only: changing it never changes the stock or value of a line. */
function incomingPaidUnits(it){return units({...it,freeQty:0,freePieceQty:0},'purchase');}
function incomingAmount(it,key='rate'){
 const p=Number(it.piecesPerBox)||1,rate=Number(it[key])||0;
 return Number(it.qty||0)*rate+Number(it.pieceQty||0)*(rate/p);
}
function incomingMode(it){return ['box','piece','mixed'].includes(it.entryUnit)?it.entryUnit:(Number(it.piecesPerBox)===1?'piece':Number(it.pieceQty||0)||Number(it.freePieceQty||0)?'mixed':'box');}
function incomingRateLabel(it,key='rate'){
 const piece=incomingMode(it)==='piece'||Number(it.piecesPerBox)===1;
 return fmt(Number(it[key]||0)/(piece?(Number(it.piecesPerBox)||1):1))+' / '+(piece?'piece':'box');
}
function stockQuantityLabel(s){const p=Number(s.piecesPerBox)||1,n=Number(s.qty)||0;return p===1?n+' pieces':Math.floor(n/p)+' boxes'+(n%p?' + '+(n%p)+' pieces':'');}
function incomingQuantityLabel(it){
 const p=Number(it.piecesPerBox)||1,paid=Number(it.qty||0)*p+Number(it.pieceQty||0),free=Number(it.freeQty||0)*p+Number(it.freePieceQty||0);
 const label=n=>incomingMode(it)==='piece'||p===1?n+' pieces':stockQuantityLabel({qty:n,piecesPerBox:p});
 return label(paid)+(free?' + '+label(free)+' free':'');
}
function incomingDraft(kind){return kind==='purchase'?purchaseDraft.items:kind==='opening'?openingStockDraft.items:kind==='return'?purchaseReturnDraft.items:kind==='purchaseEdit'?billDetailCtx.draftItems:openingDetailCtx.draftItems;}
function setIncomingMode(it,mode){
 if(!['box','piece','mixed'].includes(mode))throw Error('Select Box, Piece or Box + loose pieces.');
 if(!Number(it.piecesPerBox)&&mode==='piece')it.piecesPerBox=1;
 const p=Number(it.piecesPerBox)||1,paid=Number(it.qty||0)*p+Number(it.pieceQty||0),free=Number(it.freeQty||0)*p+Number(it.freePieceQty||0);
 if(mode==='piece'){it.qty=0;it.pieceQty=paid;it.freeQty=0;it.freePieceQty=free;}
 else {it.qty=Math.floor(paid/p);it.pieceQty=paid%p;it.freeQty=Math.floor(free/p);it.freePieceQty=free%p;if(it.pieceQty||it.freePieceQty)mode='mixed';}
 it.entryUnit=mode;
}
function changeIncomingMode(kind,idx,mode){
 try{if((kind.endsWith('Edit')||kind==='opening')&&!isOwner())throw Error('Only owners may edit this entry.');const it=incomingDraft(kind)[idx];setIncomingMode(it,mode);render();}catch(e){alert(e.message);}
}
function updateIncomingField(kind,idx,field,value){
 if((kind.endsWith('Edit')||kind==='opening')&&!isOwner())return;
 const it=incomingDraft(kind)[idx];if(!it)return;
 const p=Number(it.piecesPerBox)||1,piece=incomingMode(it)==='piece';
 if(['rate','cost','mrp'].includes(field))it[field]=Number(value)*(piece?p:1);
 else if(field==='piecesPerBox'){
  if(it.sku||kind.endsWith('Edit')||kind==='return')return;
  // Editing a packing factor in piece mode preserves the entered per-piece rates.
  const next=Number(value);if(piece&&next>0)for(const k of ['rate','cost','mrp'])if(it[k]!=null)it[k]=Number(it[k])/p*next;
  it.piecesPerBox=next;
 }else if(['qty','pieceQty','freeQty','freePieceQty'].includes(field))it[field]=Number(value);
 refreshIncomingSummary(kind);
}
function renderIncomingFields(it,idx,kind){
 setIncomingMode(it,incomingMode(it));
 const mode=incomingMode(it),piece=mode==='piece',mixed=mode==='mixed',opening=kind.startsWith('opening'),edit=kind.endsWith('Edit'),isReturn=kind==='return';
 const p=Number(it.piecesPerBox)||1,rateKey=opening?'cost':'rate',unit=piece?'piece':'box',locked=!!it.sku||edit||isReturn;
 // Historical one-piece products are shown naturally without rewriting their saved lines.
 const paid=Number(it.qty||0)*p+Number(it.pieceQty||0),free=Number(it.freeQty||0)*p+Number(it.freePieceQty||0);
 const field=(label,key,value,readOnly=false)=>`<div class="field"><label for="incoming_${kind}_${idx}_${key}">${label}</label><input id="incoming_${kind}_${idx}_${key}" data-incoming-kind="${kind}" data-incoming-field="${key}" type="number" min="0" step="${['qty','pieceQty','freeQty','freePieceQty','piecesPerBox'].includes(key)?'1':'any'}" value="${escapeHtml(entryNumber(value))}" ${readOnly?'readonly':''} oninput="updateIncomingField('${kind}',${idx},'${key}',this.value)"></div>`;
 return `<div class="field"><label for="incoming_${kind}_${idx}_unit">Entry unit</label><select id="incoming_${kind}_${idx}_unit" onchange="changeIncomingMode('${kind}',${idx},this.value)">${[['box','Box'],['piece','Piece'],['mixed','Box + loose pieces']].map(([v,t])=>`<option value="${v}" ${mode===v?'selected':''}>${t}</option>`).join('')}</select></div>
 ${piece&&p===1?'<div class="step">Individual pieces — no box quantity required.</div>':field('Pieces per box'+(locked?' (fixed)':''),'piecesPerBox',it.piecesPerBox||'',locked)}
 <div class="row2">${field((opening?'Opening':isReturn?'Return':'Paid')+' quantity ('+(piece?'pieces':'boxes')+')',piece?'pieceQty':'qty',piece?paid:Number(it.qty||0))}${mixed?field('Loose pieces','pieceQty',it.pieceQty||0):''}</div>
 ${!opening&&!isReturn?`<div class="row2">${field('Free '+(piece?'pieces':'boxes'),piece?'freePieceQty':'freeQty',piece?free:Number(it.freeQty||0))}${mixed?field('Free loose pieces','freePieceQty',it.freePieceQty||0):''}</div>`:''}
 <div class="row2">${field((opening?'Cost':'Rate')+' per '+unit+(opening?' (incl. GST)':''),rateKey,Number(it[rateKey]||0)/(piece?p:1))}${!isReturn&&kind!=='openingEdit'?field('MRP per '+unit+' (incl. GST)','mrp',Number(it.mrp||0)/(piece?p:1)):''}</div>
 ${mixed?`<div class="step">Loose pieces use the box rate ÷ pieces per box.</div>`:''}
 <div class="step" id="incoming_summary_${kind}_${idx}">${escapeHtml(incomingQuantityLabel(it))} · Value ${escapeHtml(fmt(incomingAmount(it,rateKey)))}</div>`;
}
function refreshIncomingSummary(kind){
 incomingDraft(kind).forEach((it,idx)=>{const el=document.getElementById('incoming_summary_'+kind+'_'+idx);if(el)el.textContent=incomingQuantityLabel(it)+' · Value '+fmt(incomingAmount(it,kind.startsWith('opening')?'cost':'rate'));});
 document.querySelectorAll('[data-incoming-total]').forEach(el=>{
  const type=el.dataset.incomingTotal;const d=kind==='opening'?openingStockDraft:kind==='return'?purchaseReturnDraft:purchaseDraft;
  if(kind==='opening'){if(type==='opening')el.textContent=fmt(d.items.reduce((sum,it)=>sum+incomingAmount(it,'cost'),0));return;}
  if(!['purchase','return'].includes(kind))return;
  let taxable=0,gst=0;for(const it of d.items){const br=gstBreakdown(incomingAmount(it),Number(it.gst)||0,d.gstMode);taxable+=br.taxable;gst+=br.gst;}
  const charges=(d.additionalCharges||[]).reduce((sum,c)=>sum+Number(c.amount||0),0);
  el.textContent=fmt(type==='taxable'?taxable:type==='gst'?gst:taxable+gst+charges);
 });
 document.querySelectorAll('[data-incoming-line]').forEach(el=>{const idx=Number(el.dataset.incomingLine),it=incomingDraft(kind)[idx];if(!it)return;const d=kind==='return'?purchaseReturnDraft:purchaseDraft;if(kind==='opening'){el.textContent=fmt(incomingAmount(it,'cost'));return;}if(kind!=='purchase'&&kind!=='return')return;const br=gstBreakdown(incomingAmount(it),Number(it.gst)||0,d.gstMode);el.textContent='Taxable '+fmt(br.taxable)+' • GST '+fmt(br.gst)+' • Line total '+fmt(br.total);});
}
function openingCsvItem(r,row){
 const mode=String(r[11]||'box').trim().toLowerCase();if(!['box','piece','mixed'].includes(mode))throw Error('CSV row '+row+': unit must be box, piece or mixed.');
 const p=Number(r[6]||(mode==='piece'?1:0)),q=Number(r[7]),loose=Number(r[12]||0);
 if(mode!=='mixed'&&loose!==0)throw Error('CSV row '+row+': loose pieces require mixed unit.');
 return {itemName:r[0].trim(),category:r[1].trim(),subcategory:(r[2]||'').trim(),material:(r[3]||'').trim(),size:(r[4]||'').trim(),batch:(r[5]||'').trim(),piecesPerBox:p,entryUnit:mode,qty:mode==='piece'?0:q,pieceQty:mode==='piece'?q:loose,cost:Number(r[8])*(mode==='piece'?p:1),mrp:Number(r[9]||r[8])*(mode==='piece'?p:1),gst:Number(r[10]||0)};
}
function openingEditLock(it){const s=db.stock.find(s=>s.id===it.sku);if(!s||s.mergedInto)return 'This product was removed or merged. Reconcile its stock before editing.';if(s._hasDownstream||hasDownstream(it.sku))return 'This stock already has later activity. Historical quantity and cost are protected; record a stock correction after checking the current quantity.';if(CLOUD_MODE&&!s._historyTracked)return 'Older stock history is not verified. Reconcile it before changing the opening quantity or cost.';return '';}

/* HWO numbers are display references, separate from immutable document IDs.
   Only the opening counter is touched. A retry reuses the saved number. */
let hwOpeningNumberPromise=null,hwOpeningNumberScope='',hwOpeningNumberError='',hwOpeningNumberScheduled=false;
function openingSequence(rec){const m=/^HWO(\d+)$/.exec(String(rec.openingNo||''));return m&&Number.isSafeInteger(Number(m[1]))&&Number(m[1])>0?Number(m[1]):0;}
function openingTime(rec){const ts=rec.createdAt;return typeof ts?.toMillis==='function'?ts.toMillis():ts?.seconds?ts.seconds*1000:Date.parse(rec.enteredAt||rec.date||'')||0;}
function compareOpeningCreation(a,b){return openingTime(a)-openingTime(b)||String(a.id).localeCompare(String(b.id));}
function compareOpeningNumbers(a,b){return (openingSequence(a)||Number.MAX_SAFE_INTEGER)-(openingSequence(b)||Number.MAX_SAFE_INTEGER)||compareOpeningCreation(a,b);}
function nextOpeningSequence(current){const n=Number(current||0)+1;if(!Number.isSafeInteger(n)||n<1)throw Error('Opening-stock counter needs owner review.');return n;}
async function ensureOpeningNumbers(force=false){
 if(!isOwner())return;
 const scope=CLOUD_MODE?'cloud:'+getStoredConfig()?.projectId:'local';
 if(hwOpeningNumberPromise)return hwOpeningNumberPromise;
 if(!force&&hwOpeningNumberScope===scope)return;
 hwOpeningNumberError='';
 hwOpeningNumberPromise=(async()=>{
  if(!CLOUD_MODE){
   const rows=(db.openingStock||[]).slice().sort(compareOpeningCreation),seen=new Set();
   if(!db.seqs)db.seqs={};
   for(const row of rows){const n=openingSequence(row);if(n&&seen.has(n))throw Error('Duplicate opening numbers need review. No numbers were changed.');if(n)seen.add(n);}
   localCommit(state=>{let seq=Math.max(Number(state.seqs.HWNO_opening||1)-1,Array.from(seen).reduce((a,b)=>Math.max(a,b),0));for(const row of rows)if(!openingSequence(row)){seq=nextOpeningSequence(seq);const rec=state.openingStock.find(r=>r.id===row.id);rec.legacyOpeningNo=rec.openingNo||rec.id;rec.openingNo=formatBillNo('opening',seq);rec.openingSequence=seq;}state.seqs.HWNO_opening=seq+1;});
  }else{
   // Read the complete collection once: monthly subscriptions are not a numbering baseline.
   const all=await fsDB.collection('openingStock').get({source:'server'}),rows=all.docs.map(d=>({id:d.id,...d.data()})).sort(compareOpeningCreation),seen=new Set();
   for(const row of rows){const n=openingSequence(row);if(n&&seen.has(n))throw Error('Duplicate opening numbers need review. No numbers were changed.');if(n)seen.add(n);}
   const baseline=Array.from(seen).reduce((a,b)=>Math.max(a,b),0),counterRef=fsDB.collection('meta').doc('billCounter_opening');
   await fsDB.runTransaction(async tx=>{const counter=await tx.get(counterRef);const seq=Math.max(Number(counter.exists?counter.data().seq:0)||0,baseline);tx.set(counterRef,{seq},{merge:true});});
   const missing=rows.filter(row=>!openingSequence(row));
   for(let start=0;start<missing.length;start+=100){
    const part=missing.slice(start,start+100),refs=part.map(row=>fsDB.collection('openingStock').doc(safeId(row.id)));
    const changed=await fsDB.runTransaction(async tx=>{
     const counter=await tx.get(counterRef),snaps=await Promise.all(refs.map(ref=>tx.get(ref)));let seq=Number(counter.data().seq)||0;const result=[];
     snaps.forEach((snap,i)=>{if(!snap.exists)return;const rec={id:refs[i].id,...snap.data()};if(!openingSequence(rec)){seq=nextOpeningSequence(seq);const update={legacyOpeningNo:rec.legacyOpeningNo||rec.openingNo||rec.id,openingNo:formatBillNo('opening',seq),openingSequence:seq};tx.update(refs[i],update);Object.assign(rec,update);}result.push(rec);});
     tx.set(counterRef,{seq},{merge:true});return result;
    });
    changed.forEach(rec=>{if(rec.status!=='pending')upsert('openingStock',rec);});
   }
  }
  hwOpeningNumberScope=scope;
 })();
 try{await hwOpeningNumberPromise;}catch(e){hwOpeningNumberError=e.message;throw e;}finally{hwOpeningNumberPromise=null;}
}
function scheduleOpeningNumbering(){
 if(!isOwner()||hwOpeningNumberScheduled||hwOpeningNumberPromise||hwOpeningNumberError||hwBusy.size||(CLOUD_MODE&&(!hwCloudReady||hwCloudError||!navigator.onLine||hasPendingOpening()))||!db.openingStock.some(r=>!openingSequence(r)))return;
 hwOpeningNumberScheduled=true;
 setTimeout(async()=>{hwOpeningNumberScheduled=false;if(hwBusy.size)return;await guarded('openingNumbers',async()=>{await ensureOpeningNumbers(true);});render();},0);
}
function openingNumberingNotice(){return hwOpeningNumberError?`<div class="step">Opening numbering: ${escapeHtml(hwOpeningNumberError)}</div><button class="btn btn-ghost" onclick="retryOpeningNumbers()">Retry numbering</button>`:hwOpeningNumberPromise||hwOpeningNumberScheduled?'<div class="step">Organising opening numbers…</div>':'<div class="step">Opening numbers use their own HWO sequence, separate from purchases and sales.</div>';}
async function retryOpeningNumbers(){await guarded('openingNumbers',async()=>{await ensureOpeningNumbers(true);});render();}

/* MD-H03: never redraw the screen in the middle of a tap.
   Leaving a field commits it and redraws; doing that mid-tap replaced the button being
   tapped (e.g. Save bill), so the tap was lost. On touch screens the field commits after
   the finger lifts but before the tap arrives, so redraws wait until the tap is delivered
   (or at most 350 ms after release; 3 s if a press never ends). */
let hwPointerHeld=false,hwRenderQueued=false,hwHoldTimer=0;const hwRenderNow=render;
render=function(){if(hwPointerHeld){hwRenderQueued=true;return;}return hwRenderNow.apply(this,arguments);};
function hwFlushRender(){if(hwRenderQueued&&!hwPointerHeld){hwRenderQueued=false;hwRenderNow();}}
function hwReleasePointer(){clearTimeout(hwHoldTimer);if(!hwPointerHeld)return;hwPointerHeld=false;setTimeout(hwFlushRender,0);}
document.addEventListener('pointerdown',()=>{hwPointerHeld=true;clearTimeout(hwHoldTimer);hwHoldTimer=setTimeout(hwReleasePointer,3000);},true);
const hwSoonRelease=()=>{clearTimeout(hwHoldTimer);hwHoldTimer=setTimeout(hwReleasePointer,350);};
document.addEventListener('pointerup',hwSoonRelease,true);
document.addEventListener('pointercancel',hwSoonRelease,true);
document.addEventListener('click',hwReleasePointer,true);
window.addEventListener('blur',hwReleasePointer);
/* MD-H04: after rotating (or the keyboard resizing the screen), bring the field being typed in back into view */
window.addEventListener('resize',()=>{const e=document.activeElement;if(e&&/^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName))setTimeout(()=>{if(document.activeElement===e)e.scrollIntoView({block:'center'});},150);});
const cloudStarting = initCloudIfConfigured();
updateCloudBadge();
if(!cloudStarting){
  render();
} else {
  document.getElementById('main').innerHTML = '<div class="empty" style="padding:60px 10px;"><div class="e-icon">☁</div>Connecting to your Firebase project…</div>';
}
</script>
