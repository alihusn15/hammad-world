function safeRender(){
  try{ render(); }
  catch(e){ console.error('Render error:', e); showCloudConnectError('A display error happened: '+e.message); }
}
let cloudUnsubscribers = [];
function detachCloudListeners(){
  cloudUnsubscribers.forEach(fn=>{ try{ fn(); }catch(e){} });
  cloudUnsubscribers = [];
}
/* Error handler shared by every listener. If we're in the middle of signing
   out there is legitimately no auth, so a permission error is expected noise —
   showing the error screen there would cover up the login form. */
function listenerError(label){
  return function(err){
    console.error(label, err);
    if(!firebase.auth().currentUser) return;   // signing out — ignore
    if(label==='stock'){
      showCloudConnectError('Database error ('+label+'): '+err.code+' — '+err.message);
    }
  };
}
function attachCloudListeners(){
  detachCloudListeners();   // never stack listeners from a previous session
  const sub = (fn)=>{ cloudUnsubscribers.push(fn); };

  // Collections everyone (owner + staff) can read
  sub(fsDB.collection('stock').onSnapshot(snap=>{ db.stock = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('stock')));
  sub(fsDB.collection('purchases').orderBy('createdAt','desc').limit(300).onSnapshot(snap=>{ db.purchases = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('purchases')));
  sub(fsDB.collection('sales').orderBy('createdAt','desc').limit(300).onSnapshot(snap=>{ db.sales = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('sales')));
  sub(fsDB.collection('purchaseReturns').onSnapshot(snap=>{ db.purchaseReturns = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('purchaseReturns')));
  sub(fsDB.collection('saleReturns').onSnapshot(snap=>{ db.saleReturns = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('saleReturns')));
  sub(fsDB.collection('openingStock').onSnapshot(snap=>{ db.openingStock = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('openingStock')));
  sub(fsDB.collection('quotations').onSnapshot(snap=>{ db.quotations = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('quotations')));
  sub(fsDB.collection('categories').doc('main').onSnapshot(snap=>{ if(snap.exists) db.categories = snap.data().data || defaultCategories(); safeRender(); }, listenerError('categories')));
  sub(fsDB.collection('settings').doc('shopInfo').onSnapshot(snap=>{ if(snap.exists) db.shopInfo = snap.data(); safeRender(); }, listenerError('shopInfo')));
  sub(fsDB.collection('parties').onSnapshot(snap=>{ db.parties = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('parties')));
  // Staff need payments to compute customer outstanding balances correctly.
  sub(fsDB.collection('payments').onSnapshot(snap=>{ db.payments = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('payments')));

  // Owner-only collections. Staff accounts are blocked server-side by the
  // Firestore rules, so we don't even subscribe — avoids noisy permission errors.
  if(!isServerOwner()) return;
  sub(fsDB.collection('expenses').onSnapshot(snap=>{ db.expenses = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('expenses')));
  sub(fsDB.collection('staff').onSnapshot(snap=>{ db.staff = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('staff')));
  sub(fsDB.collection('staffLedger').onSnapshot(snap=>{ db.staffLedger = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('staffLedger')));
  sub(fsDB.collection('auditLog').orderBy('createdAt','desc').limit(300).onSnapshot(snap=>{ db.auditLog = snap.docs.map(d=>({id:d.id, ...d.data()})); safeRender(); }, listenerError('auditLog')));
}

async function savePurchaseCloud(){
  const valid = purchaseDraft.items.filter(it=>it.itemName.trim() && it.category && Number(it.qty)>0 && Number(it.piecesPerBox)>0);
  if(!valid.length){ alert('Add at least one item with a name, category, pieces-per-box and quantity.'); return; }
  try{
    for(const it of valid){ if(!it.sku) it.sku = (findStockRow(it.itemName, it.batch)||{}).sku || await nextSkuCloud(it.category); }
    const lineAmounts = valid.map(it=>Number(it.qty)*Number(it.rate));
    const lineTaxables = valid.map((it,i)=>gstBreakdown(lineAmounts[i], Number(it.gst), purchaseDraft.gstMode).taxable);
    const billedTaxableTotal = lineTaxables.reduce((a,v)=>a+v,0);
    let totalAmount=0, totalGst=0;
    valid.forEach(it=>{
      const amt = Number(it.qty)*Number(it.rate);
      const br = gstBreakdown(amt, Number(it.gst), purchaseDraft.gstMode);
      totalAmount += br.taxable; totalGst += br.gst;
    });
    const chargesTotal = (purchaseDraft.additionalCharges||[]).reduce((a,c)=>a+Number(c.amount||0),0);
    const billedGrandTotal = totalAmount+totalGst;
    const actualPaidTotal = purchaseDraft.actualAmountPaid!=='' && purchaseDraft.actualAmountPaid!=null
      ? Number(purchaseDraft.actualAmountPaid) : (billedGrandTotal+chargesTotal);
    const underBillingGap = Math.max(0, actualPaidTotal - (billedGrandTotal+chargesTotal));

    const billNo = await nextBillNoCloud('purchase');
    const purchaseRefHolder = {ref:null};
    await fsDB.runTransaction(async (tx)=>{
      const refs = valid.map(it=>fsDB.collection('stock').doc(it.sku));
      const snaps = await Promise.all(refs.map(r=>tx.get(r)));
      snaps.forEach((snap,i)=>{
        const it = valid[i];
        const priorQty = snap.exists ? (snap.data().qty||0) : 0;
        const priorAvgCost = snap.exists ? (snap.data().avgCost!=null ? snap.data().avgCost : (snap.data().purchaseRate||0)) : 0;
        const itemShare = billedTaxableTotal>0 ? lineTaxables[i]/billedTaxableTotal : 0;
        const landedCostForLine = lineTaxables[i] + chargesTotal*itemShare + underBillingGap*itemShare;
        const piecesReceived = (Number(it.qty)+Number(it.freeQty)) * Number(it.piecesPerBox);
        const costPerPiece = piecesReceived>0 ? landedCostForLine/piecesReceived : 0;
        const newQty = priorQty + piecesReceived;
        const newAvgCost = newQty>0 ? ((priorQty*priorAvgCost)+(piecesReceived*costPerPiece))/newQty : costPerPiece;
        tx.set(refs[i], {
          sku: it.sku, itemName: it.itemName.trim(), category: it.category, subcategory: it.subcategory,
          material: it.material, size: it.size, brand: it.brand, batch: it.batch, piecesPerBox: Number(it.piecesPerBox),
          purchaseRate: Number(it.rate), avgCost: newAvgCost, mrp: Number(it.mrp)>0?Number(it.mrp):Number(it.rate), gst: Number(it.gst),
          qty: newQty
        }, {merge:true});
      });
      const purchaseRef = fsDB.collection('purchases').doc();
      purchaseRefHolder.ref = purchaseRef;
      const fullPurchaseTotal = billedGrandTotal+chargesTotal;
      const purchaseAmountPaid = purchaseDraft.partyId ? (purchaseDraft.paidInFull!==false ? fullPurchaseTotal : Number(purchaseDraft.amountPaid)||0) : fullPurchaseTotal;
      tx.set(purchaseRef, {
        billNo, date: todayStr(), supplier: purchaseDraft.supplier||'Unknown supplier', supplierBillNo: purchaseDraft.supplierBillNo||'', partyId: purchaseDraft.partyId||null,
        amountPaid: purchaseAmountPaid, gstMode: purchaseDraft.gstMode, items: valid, totalAmount, totalGst,
        additionalCharges: purchaseDraft.additionalCharges||[], additionalChargesTotal: chargesTotal, actualAmountPaid: actualPaidTotal,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    logAudit('Purchase created', billNo+' • '+(purchaseDraft.supplier||'Unknown'));
    purchaseDraft = {supplier:'', partyId:null, paidInFull:true, amountPaid:0, gstMode:'excluded', items:[], additionalCharges:[], actualAmountPaid:'', supplierBillNo:''};
    valid.forEach(it=> syncCatalogItem(it.sku));
    openPrintPreview('purchase', purchaseRefHolder.ref.id);
  }catch(e){ console.error(e); alert('Could not save: '+e.message); }
}
async function saveSaleCloud(){
  const saleRefHolder = {ref:null};
  try{
    const billNo = await nextBillNoCloud('sale');
    await fsDB.runTransaction(async (tx)=>{
      const refs = saleDraft.items.map(it=>fsDB.collection('stock').doc(it.stockId));
      const snaps = await Promise.all(refs.map(r=>tx.get(r)));
      snaps.forEach((snap,i)=>{
        const it = saleDraft.items[i];
        const needed = Number(it.boxQty||0)*it.piecesPerBox + Number(it.pieceQty||0);
        const avail = snap.exists ? (snap.data().qty||0) : 0;
        if(avail < needed) throw new Error(`Not enough stock for ${it.itemName}.`);
      });
      let totalAmount=0, totalGst=0, totalDiscount=0;
      snaps.forEach((snap,i)=>{
        const it = saleDraft.items[i];
        const needed = Number(it.boxQty||0)*it.piecesPerBox + Number(it.pieceQty||0);
        tx.update(refs[i], {qty: firebase.firestore.FieldValue.increment(-needed)});
        it.costAtSale = snap.exists ? (snap.data().avgCost!=null ? snap.data().avgCost : (snap.data().purchaseRate||0)) : 0;
        const gross = Number(it.boxQty||0)*Number(it.boxPrice) + Number(it.pieceQty||0)*Number(it.piecePrice);
        const disc = gross*Number(it.discount||0)/100;
        const net = gross-disc;
        const br = gstBreakdown(net, Number(it.gst), saleDraft.gstMode);
        totalAmount += br.total; totalGst += br.gst; totalDiscount += disc;
      });
      const saleRef = fsDB.collection('sales').doc();
      saleRefHolder.ref = saleRef;
      const billDiscountPct = Number(saleDraft.billDiscount)||0;
      const billDiscountAmount = totalAmount*billDiscountPct/100;
      totalAmount -= billDiscountAmount;
      totalGst = totalGst*(1-billDiscountPct/100);
      totalDiscount += billDiscountAmount;
      const chargesTotal = (saleDraft.additionalCharges||[]).reduce((a,c)=>a+Number(c.amount||0),0);
      const grandTotal = totalAmount+chargesTotal;
      const saleAmountPaid = saleDraft.partyId ? (saleDraft.paidInFull!==false ? grandTotal : Number(saleDraft.amountPaid)||0) : grandTotal;
      tx.set(saleRef, {
        billNo, date: todayStr(), customer: saleDraft.customer||'Walk-in', partyId: saleDraft.partyId||null,
        amountPaid: saleAmountPaid, gstMode: saleDraft.gstMode, items: saleDraft.items, totalAmount: grandTotal, totalGst, totalDiscount,
        additionalCharges: saleDraft.additionalCharges||[], additionalChargesTotal: chargesTotal, billDiscountPct,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });
    logAudit('Sale created', billNo+' • '+(saleDraft.customer||'Walk-in'));
    saleDraft.items.forEach(it=> syncCatalogItem(it.stockId));
    if(saleDraft.fromQuoteId){
      fsDB.collection('quotations').doc(saleDraft.fromQuoteId).update({status:'converted', convertedToBill:billNo}).catch(e=>console.error(e));
    }
    saleDraft = {customer:'', partyId:null, paidInFull:true, amountPaid:0, gstMode:'included', items:[], additionalCharges:[], billDiscount:0};
    openPrintPreview('sale', saleRefHolder.ref.id);
  }catch(e){ console.error(e); alert(e.message); }
}

/* Outstanding balance: for a supplier, positive = you owe them (Creditor).
   For a customer, positive = they owe you (Debtor). */
function partyBalance(partyId){
  const party = db.parties.find(p=>p.id===partyId);
  if(!party) return 0;
  let bal = Number(party.openingBalance)||0;
  if(party.type==='supplier'){
    db.purchases.filter(p=>p.partyId===partyId).forEach(p=>{
      const total = (p.totalAmount||0)+(p.totalGst||0)+(p.additionalChargesTotal||0);
      bal += total - (p.amountPaid!=null ? p.amountPaid : total);
    });
  } else {
    db.sales.filter(s=>s.partyId===partyId).forEach(s=>{
      const total = s.totalAmount||0;
      bal += total - (s.amountPaid!=null ? s.amountPaid : total);
    });
  }
  (db.payments||[]).filter(pay=>pay.partyId===partyId).forEach(pay=>{ bal -= Number(pay.amount)||0; });
  return bal;
}
function totalToPay(){ return db.parties.filter(p=>p.type==='supplier').reduce((a,p)=>a+Math.max(0,partyBalance(p.id)),0); }

function stockValueTotal(){ return db.stock.reduce((a,s)=>a + (s.avgCost!=null ? s.qty*s.avgCost : (s.qty/(s.piecesPerBox||1))*(s.purchaseRate||0)),0); }
function lowStockThresholdFor(s){ return s.lowStockThreshold!=null ? s.lowStockThreshold : (s.piecesPerBox||1); }

/* ===================== PUBLIC CATALOG SYNC =====================
   Mirrors ONLY customer-safe fields into a separate "catalog" collection
   that the public website reads with no login. Never include cost, avgCost,
   purchaseRate, gst, or supplier info here — this collection is world-readable
   by design, unlike everything else in this app. */
function computeCatalogStatus(s){
  if(s.comingSoon) return 'Coming Soon';
  if(!s.qty || s.qty<=0) return 'Out of Stock';
  if(s.qty <= lowStockThresholdFor(s)) return 'Limited Stock';
  return 'In Stock';
}
function syncCatalogItem(sku){
  if(!CLOUD_MODE || !fsDB) return;   // catalog only makes sense with cloud sync on
  const s = db.stock.find(x=>x.id===sku);
  if(!s) return;
  if(s.discontinued){
    fsDB.collection('catalog').doc(sku).delete().catch(e=>console.error('catalog sync (remove)', e));
    return;
  }
  const entry = {
    itemName: s.itemName||'', category: s.category||'', subcategory: s.subcategory||'',
    material: s.material||'', size: s.size||'', batch: s.batch||'',
    status: computeCatalogStatus(s), photos: s.catalogPhotos||[], featured: !!s.featured,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  fsDB.collection('catalog').doc(sku).set(entry, {merge:true}).catch(e=>console.error('catalog sync', e));
}

  if(!confirm('Publish all '+db.stock.length+' product(s) to the public catalog now?')) return;

    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{ img.src = reader.result; };
    reader.onerror = reject;
    img.onload = ()=>{
      let { width, height } = img;
      if(width > height && width > maxDimension){ height = Math.round(height*maxDimension/width); width = maxDimension; }
      else if(height > maxDimension){ width = Math.round(width*maxDimension/height); height = maxDimension; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob=>{ blob ? resolve(blob) : reject(new Error('Could not process image')); }, 'image/jpeg', quality);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadProductPhoto(sku, file, slotIndex){
  // 1600px / 90% quality — sharp on any screen, not the heavy compression
  // we'd have needed if these were stored inside Firestore.
  const blob = await resizeImageFile(file, 1600, 0.9);
  const fileKey = 'products/'+sku+'-'+slotIndex+'-'+Date.now()+'.jpg';
  const resp = await fetch(R2_WORKER_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'image/jpeg',
      'X-Upload-Secret': R2_UPLOAD_SECRET,
      'X-File-Key': fileKey
    },
    body: blob
  });
  if(!resp.ok){ throw new Error('Upload failed ('+resp.status+'): '+(await resp.text())); }
  const data = await resp.json();
  return data.url;
}

async function handlePhotoUpload(sku, fileInput){
  const s = db.stock.find(x=>x.id===sku);
  if(!s) return;
  const files = Array.from(fileInput.files||[]);
  if(!files.length) return;
  if(!s.catalogPhotos) s.catalogPhotos = [];
  const startSlot = s.catalogPhotos.length;
  const remaining = Math.max(0, 4 - s.catalogPhotos.length);
  if(!remaining){ alert('This product already has 4 photos — remove one first.'); fileInput.value=''; return; }
  const toUpload = files.slice(0, remaining);
  render(); // show a busy state immediately rather than a frozen screen
  const statusEl = document.getElementById('photoUploadStatus');
  if(statusEl) statusEl.textContent = 'Uploading '+toUpload.length+' photo(s)...';
  try{
    for(let i=0;i<toUpload.length;i++){
      const url = await uploadProductPhoto(sku, toUpload[i], startSlot+i);
      s.catalogPhotos.push(url);
    }
    if(CLOUD_MODE){
      await fsDB.collection('stock').doc(sku).update({catalogPhotos: s.catalogPhotos});
    } else {
      saveDB(db);
    }
    syncCatalogItem(sku);
    logAudit('Product photos uploaded', s.itemName+' • '+toUpload.length+' photo(s)');
    alert('✅ Saved — '+toUpload.length+' photo(s) uploaded and stored. No separate "Save" step needed, uploading saves it immediately.');
  }catch(e){
    console.error(e);
    alert('Photo upload failed: '+e.message+'\n\nCheck: Worker URL is correct, and the Worker\'s bindings/variables are all saved.');
  }
  fileInput.value = '';
  render();
}
function removeProductPhoto(sku, idx){
  const s = db.stock.find(x=>x.id===sku);

  if(!confirm('Remove this photo from the product? (It stays in R2 storage — ask the owner to delete it there later if you want to fully free the space.)')) return;

function savePartyEdits(partyId){
  const name = document.getElementById('editPartyName').value.trim();
  if(!name){ alert('Name cannot be empty.'); return; }
  const updates = {
    name,
    phone: document.getElementById('editPartyPhone').value.trim(),
    gstin: document.getElementById('editPartyGstin').value.trim(),
    address: document.getElementById('editPartyAddress').value.trim(),
    openingBalance: Number(document.getElementById('editPartyOpening').value)||0
  };
  if(CLOUD_MODE){
    fsDB.collection('parties').doc(partyId).update(updates).catch(e=>alert('Could not save: '+e.message));
  } else {
    const p = db.parties.find(x=>x.id===partyId);
    if(p) Object.assign(p, updates);
    saveDB(db);

  editingPartyDetails = false;
  render();

function deleteParty(partyId){
  const party = db.parties.find(p=>p.id===partyId);
  if(!party) return;
  const hasBills = party.type==='supplier'
    ? db.purchases.some(p=>p.partyId===partyId)
    : db.sales.some(s=>s.partyId===partyId);
  if(hasBills){ alert("Can't delete — this party has bills linked to them, and deleting would lose that ledger history."); return; }
  if(!confirm('Delete '+party.name+'? This cannot be undone.')) return;
  if(CLOUD_MODE){
    fsDB.collection('parties').doc(partyId).delete().catch(e=>alert('Could not delete: '+e.message));
  } else {
    db.parties = db.parties.filter(p=>p.id!==partyId);
    saveDB(db);
  }
  setScreen('parties');
}

function saveExpense(){
  const date = document.getElementById('expDate').value;
  const category = document.getElementById('expCategory').value;
  const amount = Number(document.getElementById('expAmount').value);
  const billRef = document.getElementById('expBillRef').value.trim();
  const note = document.getElementById('expNote').value.trim();
  if(!date || !amount || amount<=0){ alert('Enter a date and a valid amount.'); return false; }
  const record = {date, category, amount, billRef, note};
  logAudit('Expense '+(editingExpenseId?'edited':'added'), category+' • '+fmt(amount)+(note?' • '+note:''));
  if(editingExpenseId){
    if(CLOUD_MODE){
      fsDB.collection('expenses').doc(editingExpenseId).update(record).catch(e=>alert('Could not save: '+e.message));
    } else {
      const idx = db.expenses.findIndex(e=>e.id===editingExpenseId);
      if(idx>-1) db.expenses[idx] = Object.assign({id:editingExpenseId}, record);
      saveDB(db);
    }
    editingExpenseId = null;
  } else {
    if(CLOUD_MODE){
      fsDB.collection('expenses').add(Object.assign({}, record, {createdAt:firebase.firestore.FieldValue.serverTimestamp()})).catch(e=>alert('Could not save: '+e.message));
    } else {
      record.id = nextId('EXP');
      db.expenses.push(record);
      saveDB(db);
    }
  }
  render();
  return true;
}
function deleteExpense(id){
  if(!confirm('Delete this expense entry?')) return;
  if(CLOUD_MODE){
    fsDB.collection('expenses').doc(id).delete().catch(e=>alert('Could not delete: '+e.message));
  } else {
    db.expenses = db.expenses.filter(e=>e.id!==id);
    saveDB(db);
    render();
  }
}
function exportExpensesCsv(){
  const rows = [['Date','Category','Amount','Bill Ref','Note']];
  db.expenses.forEach(e=> rows.push([e.date, e.category, e.amount, e.billRef||'', e.note||'']));
  const csv = rows.map(r=> r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');

  const url = URL.createObjectURL(blob);

  a.href = url; a.download = 'hammad-world-expenses-'+todayStr()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function staffBalance(staffId){
  const staff = db.staff.find(s=>s.id===staffId);
  if(!staff) return 0;
  let bal = Number(staff.openingBalance)||0;
  db.staffLedger.filter(e=>e.staffId===staffId).forEach(e=>{
    if(e.type==='due') bal += Number(e.amount)||0;
    else bal -= Number(e.amount)||0; // payment or advance
  });
  return bal;
}

  };

function deleteStaff(staffId){
  const staff = db.staff.find(s=>s.id===staffId);
  if(!staff) return;
  const hasEntries = db.staffLedger.some(e=>e.staffId===staffId);
  if(hasEntries){ alert("Can't delete — this staff member has salary/payment history, and deleting would lose that record."); return; }
  if(!confirm('Delete '+staff.name+'? This cannot be undone.')) return;
  if(CLOUD_MODE){
    fsDB.collection('staff').doc(staffId).delete().catch(e=>alert('Could not delete: '+e.message));
  } else {
    db.staff = db.staff.filter(s=>s.id!==staffId);
    saveDB(db);
  }
  setScreen('staffList');
}

/* ===================== PROFIT & LOSS ===================== */
let pnlMode = 'monthly';
let pnlMonth = new Date().toISOString().slice(0,7);
let pnlYear = new Date().getFullYear().toString();
let pnlFrom = new Date().toISOString().slice(0,10);
let pnlTo = new Date().toISOString().slice(0,10);

function renderPnL(){
  if(!isOwner()) return ownerOnlyNotice();
  const today = todayStr();
  let sales, purchases, saleReturns, purchaseReturns, expenses, periodLabel;
  if(pnlMode==='daily'){
    sales = db.sales.filter(s=>s.date===today);
    purchases = db.purchases.filter(p=>p.date===today);
    saleReturns = db.saleReturns.filter(r=>r.date===today);
    purchaseReturns = db.purchaseReturns.filter(r=>r.date===today);
    expenses = db.expenses.filter(e=>e.date===today);
    periodLabel = "Today";
  } else if(pnlMode==='monthly'){
    sales = db.sales.filter(s=>s.date.startsWith(pnlMonth));
    purchases = db.purchases.filter(p=>p.date.startsWith(pnlMonth));
    saleReturns = db.saleReturns.filter(r=>r.date.startsWith(pnlMonth));
    purchaseReturns = db.purchaseReturns.filter(r=>r.date.startsWith(pnlMonth));
    expenses = db.expenses.filter(e=>e.date.startsWith(pnlMonth));
    periodLabel = pnlMonth;
  } else if(pnlMode==='yearly'){
    sales = db.sales.filter(s=>s.date.startsWith(pnlYear));
    purchases = db.purchases.filter(p=>p.date.startsWith(pnlYear));
    saleReturns = db.saleReturns.filter(r=>r.date.startsWith(pnlYear));
    purchaseReturns = db.purchaseReturns.filter(r=>r.date.startsWith(pnlYear));
    expenses = db.expenses.filter(e=>e.date.startsWith(pnlYear));
    periodLabel = 'Year '+pnlYear;
  } else {
    const from = pnlFrom||today, to = pnlTo||today;
    sales = db.sales.filter(s=>s.date>=from && s.date<=to);
    purchases = db.purchases.filter(p=>p.date>=from && p.date<=to);
    saleReturns = db.saleReturns.filter(r=>r.date>=from && r.date<=to);
    purchaseReturns = db.purchaseReturns.filter(r=>r.date>=from && r.date<=to);
    expenses = db.expenses.filter(e=>e.date>=from && e.date<=to);
    periodLabel = from+' to '+to;
  }

  // Revenue (taxable, GST kept out) and true cost, using the cost captured at
  // the moment each item was actually sold — not today's cost.
  let salesTaxable = 0, cogs = 0, saleChargesTotal = 0;
  sales.forEach(s=>{
    saleChargesTotal += (s.additionalChargesTotal||0);
    let saleTaxableSubtotal = 0;
    (s.items||[]).forEach(it=>{
      const gross = Number(it.boxQty||0)*Number(it.boxPrice) + Number(it.pieceQty||0)*Number(it.piecePrice);
      const disc = gross*Number(it.discount||0)/100;
      const net = gross-disc;
      const br = gstBreakdown(net, Number(it.gst), s.gstMode);
      saleTaxableSubtotal += br.taxable;
      const piecesSold = Number(it.boxQty||0)*(it.piecesPerBox||1) + Number(it.pieceQty||0);
      cogs += piecesSold * (it.costAtSale!=null ? it.costAtSale : 0);
    });
    // A bill-level discount (applied on top of item-level ones) reduces
    // revenue the same way it reduced what the customer actually paid.
    salesTaxable += saleTaxableSubtotal * (1 - (s.billDiscountPct||0)/100);
  });
  const saleReturnTaxable = saleReturns.reduce((a,r)=>{
    return a + (r.items||[]).reduce((a2,it)=>{
      const amt = Number(it.boxQty||0)*Number(it.boxPrice) + Number(it.pieceQty||0)*Number(it.piecePrice);
      return a2 + gstBreakdown(amt, Number(it.gst), r.gstMode||'included').taxable;
    }, 0);
  }, 0);
  const saleReturnCostReversal = saleReturns.reduce((a,r)=>{
    return a + (r.items||[]).reduce((a2,it)=>{
      const piecesReturned = Number(it.boxQty||0)*(it.piecesPerBox||1) + Number(it.pieceQty||0);
      return a2 + piecesReturned*(it.costAtSale!=null ? it.costAtSale : 0);
    }, 0);
  }, 0);
  const netRevenue = salesTaxable - saleReturnTaxable;
  const netCogs = cogs - saleReturnCostReversal;
  const grossProfit = netRevenue - netCogs;
  const operatingExpenses = expenses.reduce((a,e)=>a+Number(e.amount||0),0);
  const netProfit = grossProfit - saleChargesTotal - operatingExpenses;

  const outputGst = sales.reduce((a,s)=>a+(s.totalGst||0),0);
  const inputGstGross = purchases.reduce((a,p)=>a+(p.totalGst||0),0);
  const inputGstReversed = purchaseReturns.reduce((a,r)=>a+(r.totalGst||0),0);
  const inputGst = inputGstGross - inputGstReversed;
  const netGstPayable = outputGst - inputGst;

  return `
    <button class="btn btn-ghost" style="margin-bottom:10px;" onclick="setScreen('dashboard')">← Back to Dashboard</button>
    <div class="segment">
      <button class="${pnlMode==='daily'?'active':''}" onclick="pnlMode='daily';render()">Daily</button>
      <button class="${pnlMode==='monthly'?'active':''}" onclick="pnlMode='monthly';render()">Monthly</button>
      <button class="${pnlMode==='yearly'?'active':''}" onclick="pnlMode='yearly';render()">Yearly</button>
      <button class="${pnlMode==='custom'?'active':''}" onclick="pnlMode='custom';render()">Custom</button>
    </div>
    ${pnlMode==='monthly' ? `<div class="field"><label>Month</label><input type="month" value="${pnlMonth}" onchange="pnlMonth=this.value;render()"/></div>` : ''}
    ${pnlMode==='yearly' ? `<div class="field"><label>Year</label><input type="number" value="${pnlYear}" onchange="pnlYear=this.value;render()"/></div>` : ''}
    ${pnlMode==='custom' ? `
      <div class="row2">
        <div class="field"><label>From</label><input type="date" value="${pnlFrom}" onchange="pnlFrom=this.value;render()"/></div>
        <div class="field"><label>To</label><input type="date" value="${pnlTo}" onchange="pnlTo=this.value;render()"/></div>
      </div>` : ''}

    <div class="card">
      <h3>${periodLabel} — Profit &amp; Loss</h3>
      <div class="total-line"><span>Net sales revenue (taxable, excl. GST)</span><span>${fmt(netRevenue)}</span></div>
      <div class="total-line"><span>True cost of goods sold (net of returns)</span><span>-${fmt(netCogs)}</span></div>
      <div class="total-line grand"><span>Gross Profit</span><span>${fmt(grossProfit)}</span></div>
      <div class="total-line" style="margin-top:10px;"><span>Sale-side delivery charges</span><span>-${fmt(saleChargesTotal)}</span></div>
      <div class="total-line"><span>Operating expenses (Rent, Salary, etc.)</span><span>-${fmt(operatingExpenses)}</span></div>
      <div class="total-line grand" style="color:${netProfit<0?'var(--red-700)':'var(--green-heading)'};"><span>Net Profit${netProfit<0?' (Loss)':''}</span><span>${fmt(netProfit)}</span></div>
    </div>

    <div class="card">
      <h3>GST position (not part of profit — compliance only)</h3>
      <div class="total-line"><span>Output GST (collected on sales)</span><span>${fmt(outputGst)}</span></div>
      <div class="total-line"><span>Input Tax Credit (paid on purchases)</span><span>-${fmt(inputGst)}</span></div>
      <div class="total-line grand"><span>Net GST ${netGstPayable>=0?'Payable':'Receivable'}</span><span>${fmt(Math.abs(netGstPayable))}</span></div>
    </div>

    <div class="card">
      <h3>How this was calculated</h3>
      <div class="step">• Cost of goods = weighted-average landed cost (purchase rate + proportional transport/labour + any under-billed cash gap you entered) at the exact time each item was sold.</div>
      <div class="step">• GST is fully excluded from profit — it's shown separately above as a compliance figure only.</div>
      <div class="step">• Sale-side delivery charges and all Expense Management entries (Rent, Salary, etc.) are deducted as real costs.</div>
      <div class="step">• Sale Returns reduce both revenue and cost (using the item's original sale cost) — so returned goods don't distort profit.</div>
      <div class="step">• Purchase Returns reduce Input Tax Credit too — you can't claim GST credit on stock you sent back.</div>
    </div>
  `;
}

function addQuoteItem(stockId){
  const s = db.stock.find(x=>x.id===stockId);
  if(!s) return;
  const ppb = s.piecesPerBox||1;
  quoteDraft.items.push({stockId:s.id, itemName:s.itemName, batch:s.batch, piecesPerBox:ppb,
    boxPrice:s.mrp, piecePrice:s.mrp/ppb, boxQty:1, pieceQty:0, discount:0, gst:s.gst});
  document.getElementById('quoteSearch').value='';
  render();
}
function removeQuoteItem(idx){ quoteDraft.items.splice(idx,1); render(); }
function updateQuoteItem(idx,field,val){ quoteDraft.items[idx][field]=Number(val); render(); }
function saveQuotation(){
  if(!quoteDraft.items.length){ alert('Add at least one item.'); return; }
  const total = quoteDraft.items.reduce((a,it)=>{
    const gross = Number(it.boxQty||0)*Number(it.boxPrice) + Number(it.pieceQty||0)*Number(it.piecePrice);
    return a + (gross - gross*Number(it.discount||0)/100);
  },0);
  const record = {
    date: todayStr(), customer: quoteDraft.customer||'Walk-in', phone: quoteDraft.phone||'',
    gstMode: quoteDraft.gstMode, items: quoteDraft.items, total, validDays: quoteDraft.validDays||15,
    notes: quoteDraft.notes||'', status:'open'
  };
  if(CLOUD_MODE){
    nextBillNoCloud('quote').then(quoteNo=>{
      return fsDB.collection('quotations').add(Object.assign({}, record, {quoteNo, createdAt:firebase.firestore.FieldValue.serverTimestamp()}));
    }).then(ref=>{
      logAudit('Quotation created', record.customer+' • '+fmt(total));
      quoteDraft = {customer:'',phone:'',gstMode:'included',items:[],validDays:15,notes:''};
      quoteView='list';
      openPrintPreview('quotation', ref.id);
    }).catch(e=>alert('Could not save: '+e.message));
  } else {
    record.id = nextId('QT');
    record.quoteNo = 'HWQ'+String((db.quotations||[]).length+1).padStart(5,'0');
    if(!db.quotations) db.quotations=[];
    db.quotations.push(record);
    saveDB(db);
    logAudit('Quotation created', record.customer+' • '+fmt(total));
    quoteDraft = {customer:'',phone:'',gstMode:'included',items:[],validDays:15,notes:''};
    quoteView='list';
    openPrintPreview('quotation', record.id);
  }
}
function convertQuoteToSale(quoteId){
  const q = (db.quotations||[]).find(x=>x.id===quoteId);
  if(!q){ alert('Quotation not found.'); return; }
  if(!confirm('Convert '+q.quoteNo+' into a sale bill? It will open in the Sale screen for you to confirm.')) return;
  saleDraft = {
    customer: q.customer||'', partyId:null, paidInFull:true, amountPaid:0,
    gstMode: q.gstMode||'included', items: JSON.parse(JSON.stringify(q.items)),
    additionalCharges:[], billDiscount:0, fromQuoteId: quoteId
  };
  saleScreenMode = 'new';
  setScreen('sales');
}

/* Creates a login for a new staff/owner account without disturbing the
   current session. Firebase's normal "create user" call signs in as that
   new user immediately — which would log the owner out mid-task. The fix:
   spin up a second, throwaway connection to the same Firebase project just
   for this one step, then close it. No Cloud Function or paid plan needed. */
async function createStaffAccount(){
  const name = document.getElementById('quickUserName').value.trim();
  const email = document.getElementById('quickUserEmail').value.trim();
  const password = document.getElementById('quickUserPassword').value;
  const role = document.getElementById('quickUserRole').value;
  if(!name || !email || !password){ alert('Fill in name, email and password.'); return; }
  if(password.length<6){ alert('Password needs to be at least 6 characters.'); return; }

  const cfg = getStoredConfig();
  let secondaryApp;
  try{
    secondaryApp = firebase.initializeApp(cfg, 'AccountCreator_'+Date.now());
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, password);
    const newUid = cred.user.uid;
    await secondaryApp.auth().signOut();
    await fsDB.collection('users').doc(newUid).set({name, role});
    logAudit('Staff account created', name+' ('+email+') → '+role);
    alert('Account created.\n\nEmail: '+email+'\nPassword: '+password+'\n\nShare these with '+name+' — they will use them on the sign-in screen.');
    document.getElementById('quickUserName').value='';
    document.getElementById('quickUserEmail').value='';
    document.getElementById('quickUserPassword').value='';
  }catch(e){
    console.error(e);
    alert('Could not create account: '+e.message);
  }finally{
    if(secondaryApp) secondaryApp.delete().catch(()=>{});
  }
}
window.createStaffAccount = createStaffAccount;

function renderPrintPreview(){

  const isQuotation = (type==='quotation');

  const items = record.items||[];
  const rows = items.map(it=>{

      return `<tr><td>${it.itemName||''}${it.batch?` (${it.batch})`:''}</td><td class="num">${qtyLabel}</td><td class="num">${fmt(boxPrice)}</td><td class="num">${gst}%</td><td class="num">${fmt(amt)}</td></tr>`;

  const taxable = isQuotation ? (record.total||0) : (record.totalAmount||0);

  const charges = record.additionalChargesTotal||0;
  const inclusive = (type==='sale' || type==='saleReturn' || isQuotation);

          <div style="display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;background:var(--stone-200);padding:4px 12px;border-radius:20px;color:var(--clay-700);">${docTitle}</div>

        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-500);margin-bottom:10px;border-bottom:1px dashed var(--line);padding-bottom:10px;">
          <span>Doc no: <b style="color:var(--ink-900);">${record.billNo||record.quoteNo||record.id}</b></span>
          <span>Date: <b style="color:var(--ink-900);">${record.date}</b></span>
        </div>
        <div class="step" style="margin-bottom:10px;">${refLine}</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;">
          <thead><tr><th style="text-align:left;font-size:10.5px;color:var(--ink-500);border-bottom:1.5px solid var(--line);padding:6px 4px;">Item</th><th style="text-align:right;font-size:10.5px;color:var(--ink-500);border-bottom:1.5px solid var(--line);padding:6px 4px;">Qty</th><th style="text-align:right;font-size:10.5px;color:var(--ink-500);border-bottom:1.5px solid var(--line);padding:6px 4px;">Rate</th><th style="text-align:right;font-size:10.5px;color:var(--ink-500);border-bottom:1.5px solid var(--line);padding:6px 4px;">GST</th><th style="text-align:right;font-size:10.5px;color:var(--ink-500);border-bottom:1.5px solid var(--line);padding:6px 4px;">Amount</th></tr></thead>

        <div class="total-line grand"><span>Total</span><span>${fmt(grand)}</span></div>
        <div class="step" style="margin-top:14px;text-align:center;">This is a system-generated document from ${shop.name||'Hammad World'}.</div>

  const a = document.createElement('a');
  a.href = url; a.download = 'hammad-world-backup-'+todayStr()+'.json';

function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('This will replace all data currently on this device with the backup file. Continue?')) return;
      db = parsed;
      if(!db.parties) db.parties=[];
      if(!db.payments) db.payments=[];
      if(!db.categories) db.categories = defaultCategories();
      if(!db.purchaseReturns) db.purchaseReturns=[];
      if(!db.saleReturns) db.saleReturns=[];
      if(!db.expenses) db.expenses=[];
      if(!db.staff) db.staff=[];
      if(!db.staffLedger) db.staffLedger=[];
      if(!db.openingStock) db.openingStock=[];
      saveDB(db);
      alert('Backup restored.');
      render();
    }catch(e){ alert('Could not read that file — make sure it\'s a backup exported from this app.'); }
  };
  reader.readAsText(file);
}
window.exportBackup = exportBackup;

/* ===================== KEYBOARD FIELD NAVIGATION (desktop convenience) =====================
   Press Enter (or Down arrow) in any field to jump to the next one, Up arrow to
   go back — like moving between cells in a spreadsheet. Works everywhere in the
   app automatically since it just looks at whatever's currently on screen. */
function focusAdjacentField(current, direction){
  const all = Array.from(document.querySelectorAll('input, select')).filter(function(f){
    return f.offsetParent !== null && !f.disabled;
  });
  const idx = all.indexOf(current);
  if(idx===-1) return;
  const nextIdx = idx + direction;
  if(nextIdx>=0 && nextIdx<all.length){
    all[nextIdx].focus();
    try{ all[nextIdx].select(); }catch(e){}
  }
}
document.addEventListener('keydown', function(e){
  const el = document.activeElement;
  if(!el) return;
  const tag = el.tagName;
  if(tag!=='INPUT' && tag!=='SELECT') return;
  const isSelect = tag==='SELECT';
  if(e.key==='Enter' || (!isSelect && e.key==='ArrowDown')){
    e.preventDefault();
    focusAdjacentField(el, 1);
  } else if(!isSelect && e.key==='ArrowUp'){
    e.preventDefault();
    focusAdjacentField(el, -1);
  }
});
